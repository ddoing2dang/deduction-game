<path d="M915 594 H1033 L1058 571 L1083 594 L1108 571 L1134 594 H1255" fill="none" stroke="#c59a56" stroke-width="5"/>
<path d="M1084 559 L1110 590 L1084 621 L1058 590Z" fill="#df9db4" stroke="#b28747" stroke-width="5"/>
</g></svg>