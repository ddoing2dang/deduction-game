<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2172 724" width="2172" height="724">
<title>Music broadcast dialogue frame - compact ornament over left nameplate</title>
<defs>
 <linearGradient id="body" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#fff9fd" stop-opacity=".88"/><stop offset="1" stop-color="#f6eaf3" stop-opacity=".73"/></linearGradient>
 <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9fa" stop-opacity=".94"/><stop offset="1" stop-color="#f6e8ee" stop-opacity=".83"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#f5deae"/><stop offset=".48" stop-color="#ad7b39"/><stop offset="1" stop-color="#e7c385"/></linearGradient>
</defs>
<g stroke-linejoin="round">
