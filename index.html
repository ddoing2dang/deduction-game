<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deduction Web Prototype</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c0b12;color:#f5f1ff}*{box-sizing:border-box}body{margin:0;background:#0c0b12}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#15121d;border-bottom:1px solid #ffffff22}main{display:grid;grid-template-columns:minmax(620px,1fr) 330px;gap:14px;padding:14px}.board{position:relative;min-height:700px;border:1px solid #ffffff1c;border-radius:18px;background:radial-gradient(circle,#292235,#121018);overflow:hidden}.room{position:absolute;border:1px solid #ffffff30;border-radius:14px;background:#25202e;padding:10px;box-shadow:0 10px 25px #0008}.room.current{outline:2px solid #ff9cda}.room.reachable{outline:2px solid #b985e5;cursor:pointer;transform:translateY(-2px)}.room small{display:block;color:#aaa1b5}.players{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.pawn{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#eee;color:#16121b;font-size:11px;font-weight:800}.pawn.me{box-shadow:0 0 0 2px #ff6fc5}aside{display:flex;flex-direction:column;gap:10px}.card{background:#18151f;border:1px solid #ffffff1c;border-radius:14px;padding:14px}.card h3{margin:0 0 9px}.pill{display:inline-block;background:#2d2737;border-radius:999px;padding:5px 8px;margin:3px;font-size:12px}button{border:0;border-radius:9px;padding:10px 12px;margin:3px;background:#76508c;color:#fff;font-weight:700}button:disabled{opacity:.3}#log{position:absolute;left:12px;bottom:12px;width:min(480px,70%);max-height:145px;overflow:auto;background:#08070bcc;padding:10px;border-radius:12px;font-size:12px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center}.hidden{display:none}.dialog{width:min(500px,92vw);background:#1c1823;border-radius:16px;padding:20px}.dialog select{width:100%;padding:9px;margin:4px 0;background:#292431;color:white}@media(max-width:900px){main{grid-template-columns:1fr;padding:8px}.board{min-height:620px}}</style></head><body><header><b>DEDUCTION · WEB PROTOTYPE</b><span id="round"></span></header><main><section class="board"><div id="map"></div><div id="log"></div></section><aside><h2 id="turnTitle"></h2><div class="card" id="status"></div><div class="card"><h3>내 정보</h3><div id="hand"></div></div><div class="card"><h3>행동</h3><div id="actions"></div></div><div class="card"><h3>추리 노트</h3><div id="notes"></div></div></aside></main><div id="modal" class="modal hidden"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions"></div></div></div><script>const q=s=>document.querySelector(s);
const rooms=["중앙홀","서재","응접실","식당","주방","온실","보일러실","와인저장고","사용인실"];
const pos=[[42,28],[13,25],[70,25],[13,51],[42,52],[42,5],[13,76],[42,76],[71,76]];
const names=["나즈","찌로","마리히","마또","보키","문이레"];
let turn=0,round=1,points=3,room=0;
function draw(){
 q("#round").textContent="ROUND "+round+" / 12";
 q("#turnTitle").textContent="내 턴 · 나즈";
 q("#status").innerHTML="<b>위치</b> "+rooms[room]+"<br><b>이동 P</b> "+points+"<br><b>행동</b> 가능";
 q("#hand").innerHTML='<span class="pill">장소 카드: 식당</span><span class="pill">무기 카드: 단검</span><p>조사자 · 웹 테스트 모드</p>';
 q("#notes").innerHTML="웹 프로토타입 정상 실행 중";
 q("#actions").innerHTML='<button onclick="nextTurn()">턴 종료</button>';
 let m=q("#map");m.innerHTML="";
 rooms.forEach((n,i)=>{let d=document.createElement("div");d.className="room"+(i===room?" current":"");d.style.left=pos[i][0]+"%";d.style.top=pos[i][1]+"%";d.style.width="18%";d.style.height="12%";d.innerHTML="<b>"+(i+1)+". "+n+"</b><small>"+(i>5?"지하":"지상")+"</small>"+(i===room?'<div class="players"><span class="pawn me">나</span></div>':"");d.onclick=()=>{room=i;points=Math.max(0,points-1);draw()};m.appendChild(d)});
 q("#log").innerHTML="<div>게임 화면 정상 로드</div><div>방을 눌러 이동 테스트 가능</div>";
}
function nextTurn(){round=round>=12?1:round+1;points=round===1?3:2;draw()}
draw();</script></body></html>
